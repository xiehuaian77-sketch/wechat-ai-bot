<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" fill="url(#bgGrad2)" rx="16"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="#f8fafc">✨ 核心功能特性</text>
  <text x="450" y="62" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#94a3b8">ComWeChatRobot + FastAPI + LangGraph + ChromaDB</text>

  <!-- Feature Cards Row 1 -->
  <!-- Card 1: Multi-Model -->
  <rect x="30" y="85" width="190" height="120" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="125" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32">🧠</text>
  <text x="125" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#f8fafc">多模型编排</text>
  <text x="125" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">9 大 Provider</text>
  <text x="125" y="174" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">32+ 模型</text>
  <text x="125" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">自动故障转移</text>

  <!-- Card 2: Battle Mode -->
  <rect x="240" y="85" width="190" height="120" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="335" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32">⚔️</text>
  <text x="335" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Battle Mode</text>
  <text x="335" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">双模型同台 PK</text>
  <text x="335" y="174" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">你当裁判投票</text>
  <text x="335" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">选出最佳答案</text>

  <!-- Card 3: RAG -->
  <rect x="450" y="85" width="190" height="120" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="545" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32">📚</text>
  <text x="545" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#f8fafc">RAG 知识库</text>
  <text x="545" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">PDF / Word / CSV</text>
  <text x="545" y="174" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">ChromaDB 向量检索</text>
  <text x="545" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">秒变专属知识库</text>

  <!-- Card 4: CoT Visualization -->
  <rect x="660" y="85" width="190" height="120" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="755" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32">🎨</text>
  <text x="755" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#f8fafc">CoT 可视化</text>
  <text x="755" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">思维链逐帧展开</text>
  <text x="755" y="174" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">看 AI 如何思考</text>
  <text x="755" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">透明可解释</text>

  <!-- Feature Cards Row 2 -->
  <!-- Card 5: SSE Streaming -->
  <rect x="30" y="230" width="190" height="120" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="125" y="260" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32">🔌</text>
  <text x="125" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#f8fafc">SSE 流式输出</text>
  <text x="125" y="303" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">打字机效果</text>
  <text x="125" y="319" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">零延迟感知</text>
  <text x="125" y="335" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">实时响应</text>

  <!-- Card 6: Enterprise Reliability -->
  <rect x="240" y="230" width="190" height="120" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="335" y="260" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32">🛡️</text>
  <text x="335" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#f8fafc">企业级可靠性</text>
  <text x="335" y="303" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">熔断器 + 自动重连</text>
  <text x="335" y="319" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">限流 + 权限控制</text>
  <text x="335" y="335" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">生产环境就绪</text>

  <!-- Card 7: Docker -->
  <rect x="450" y="230" width="190" height="120" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="545" y="260" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32">🐳</text>
  <text x="545" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Docker 一键部署</text>
  <text x="545" y="303" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">ChromaDB + Nginx</text>
  <text x="545" y="319" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">HTTPS 完整环境</text>
  <text x="545" y="335" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">5 分钟上线</text>

  <!-- Card 8: Mobile -->
  <rect x="660" y="230" width="190" height="120" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="755" y="260" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32">📱</text>
  <text x="755" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#f8fafc">移动端适配</text>
  <text x="755" y="303" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">微信里发消息</text>
  <text x="755" y="319" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">手机上管理</text>
  <text x="755" y="335" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">随时随地</text>

  <!-- Bottom Tech Stack Bar -->
  <rect x="30" y="370" width="840" height="20" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="450" y="384" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">
    Python 3.12+ · FastAPI · LangGraph · ChromaDB · SQLAlchemy 2.0 · Pydantic v2 · Docker · Uvicorn
  </text>
</svg>
