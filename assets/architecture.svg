<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="url(#bgGrad)" rx="16"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="#0f172a">WeChat AI Bot 架构总览</text>
  <text x="450" y="62" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#64748b">ComWeChatRobot + FastAPI + LangGraph + ChromaDB</text>

  <!-- WeChat Client Box -->
  <rect x="40" y="90" width="200" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#0f172a">📱 微信 PC 客户端</text>
  <text x="140" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">ComWeChatRobot</text>
  <text x="140" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">消息捕获 + Hook</text>
  <text x="140" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">HTTP POST /hook/wechat</text>

  <!-- Arrow: WeChat -> FastAPI -->
  <line x1="240" y1="145" x2="310" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="275" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">HTTPS</text>

  <!-- FastAPI Service Box -->
  <rect x="310" y="90" width="220" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#f8fafc">⚡ FastAPI 服务</text>
  <text x="420" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">Uvicorn 异步高性能</text>
  <text x="420" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">/hook/wechat + /api/*</text>
  <text x="420" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">限流 · CORS · 权限控制</text>

  <!-- Arrow: FastAPI -> Message Router -->
  <line x1="420" y1="200" x2="420" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="440" y="225" text-anchor="start" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">分发</text>

  <!-- Message Router Box -->
  <rect x="310" y="240" width="220" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="265" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#0f172a">📨 消息分发中间件</text>
  <text x="420" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">文本 / 文件 / 命令 路由</text>

  <!-- Three branches from router -->
  <line x1="380" y1="300" x2="200" y2="360" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="300" x2="420" y2="360" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="460" y1="300" x2="640" y2="360" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Branch Labels -->
  <text x="200" y="355" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a" font-weight="500">AI Agent</text>
  <text x="420" y="355" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a" font-weight="500">RAG 知识库</text>
  <text x="640" y="355" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a" font-weight="500">管理 API</text>

  <!-- AI Agent Box -->
  <rect x="80" y="360" width="240" height="140" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="385" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#0f172a">🧠 AI Agent 引擎（LangGraph）</text>
  <text x="200" y="405" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">4 节点状态机工作流</text>

  <!-- Agent Nodes -->
  <rect x="95" y="415" width="90" height="32" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="140" y="435" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1e40af">Planner 规划器</text>

  <rect x="205" y="415" width="90" height="32" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="250" y="435" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1e40af">Executor 执行器</text>

  <rect x="95" y="455" width="90" height="32" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="140" y="475" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1e40af">Reflector 反思器</text>

  <rect x="205" y="455" width="90" height="32" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="250" y="475" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1e40af">Responder 回复器</text>

  <!-- Agent Flow Arrows -->
  <line x1="140" y1="447" x2="140" y2="455" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="250" y1="447" x2="250" y2="455" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="185" y1="431" x2="205" y2="431" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="185" y1="471" x2="205" y2="471" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- RAG Knowledge Box -->
  <rect x="310" y="360" width="220" height="140" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="385" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#0f172a">📚 RAG 知识库（ChromaDB）</text>
  <text x="420" y="405" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">PDF / Word / CSV / 图片解析</text>

  <!-- RAG Components -->
  <rect x="325" y="415" width="90" height="32" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="370" y="435" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#92400e">文件解析器</text>

  <rect x="425" y="415" width="90" height="32" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="470" y="435" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#92400e">Embedding 模型</text>

  <rect x="325" y="455" width="190" height="32" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="420" y="475" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#92400e">ChromaDB 向量检索</text>

  <!-- Admin API Box -->
  <rect x="540" y="360" width="220" height="140" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="385" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#0f172a">⚙️ 管理 API + 工具集</text>
  <text x="650" y="405" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">白名单 / 黑名单 / 审计日志</text>

  <!-- Admin Components -->
  <rect x="555" y="415" width="90" height="32" rx="8" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="600" y="435" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#065f46">权限管理</text>

  <rect x="655" y="415" width="90" height="32" rx="8" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="700" y="435" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#065f46">工单 / 审计</text>

  <rect x="555" y="455" width="190" height="32" rx="8" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="650" y="475" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#065f46">Function Calling 工具集</text>

  <!-- External Providers Box -->
  <rect x="310" y="520" width="450" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  <text x="535" y="545" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#0f172a">🌐 外部 AI 服务</text>
  <text x="535" y="565" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">OpenAI / DeepSeek / Claude / Gemini / 通义千问 / 智谱</text>
  <text x="535" y="582" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">9 大 Provider · 32+ 模型 · 自动故障转移</text>

  <!-- Arrows to External -->
  <line x1="140" y1="500" x2="140" y2="530" stroke="#64748b" stroke-width="1.5"/>
  <line x1="420" y1="500" x2="420" y2="530" stroke="#64748b" stroke-width="1.5"/>
  <line x1="650" y1="500" x2="650" y2="530" stroke="#64748b" stroke-width="1.5"/>
  <line x1="140" y1="530" x2="310" y2="555" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="530" x2="420" y2="555" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="650" y1="530" x2="535" y2="555" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Data Storage Box -->
  <rect x="660" y="90" width="200" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  <text x="760" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#0f172a">💾 数据存储层</text>
  <text x="760" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">SQLite + ChromaDB</text>
  <text x="760" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">对话历史 · 权限 · 日志</text>
  <text x="760" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">向量检索 · 本地持久化</text>

  <!-- Arrow: FastAPI -> Data -->
  <line x1="530" y1="145" x2="660" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="595" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">读写</text>

  <!-- Legend -->
  <rect x="40" y="530" width="240" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="550" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#0f172a">图例说明</text>
  <circle cx="60" cy="568" r="5" fill="#1e293b"/>
  <text x="72" y="572" font-family="system-ui,sans-serif" font-size="10" fill="#475569">核心服务</text>
  <circle cx="160" cy="568" r="5" fill="#dbeafe"/>
  <text x="172" y="572" font-family="system-ui,sans-serif" font-size="10" fill="#475569">AI Agent 节点</text>
  <circle cx="260" cy="568" r="5" fill="#fef3c7"/>
  <text x="272" y="572" font-family="system-ui,sans-serif" font-size="10" fill="#475569">RAG 组件</text>
</svg>
