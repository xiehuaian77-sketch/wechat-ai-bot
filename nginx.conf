events {
    worker_connections 1024;
}

http {
    upstream wechat_api {
        server wechat-ai-bot:8000;
    }

    # 限流配置
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=wechat_hook:10m rate=50r/s;

    server {
        listen 80;
        server_name _;

        # 微信 Hook（高频，独立限流）
        location /hook/ {
            limit_req zone=wechat_hook burst=20 nodelay;
            proxy_pass http://wechat_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # 管理 API（严格限流）
        location /api/ {
            limit_req zone=api burst=5 nodelay;
            proxy_pass http://wechat_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 健康检查（无需限流）
        location /health {
            proxy_pass http://wechat_api;
            access_log off;
        }

        # 文档
        location /docs {
            proxy_pass http://wechat_api;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://wechat_api;
            proxy_set_header Host $host;
        }
    }
}