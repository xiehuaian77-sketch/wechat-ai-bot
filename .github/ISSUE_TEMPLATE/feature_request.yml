name: ✨ Feature Request
description: 建议一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你想要的功能以及它解决什么问题。

  - type: textarea
    id: problem
    attributes:
      label: 问题背景
      description: 这个功能请求解决了什么问题？是否有相关 Issue？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 清晰简洁地描述你想要的功能
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 描述你考虑过的其他解决方案

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 添加任何其他上下文或截图
