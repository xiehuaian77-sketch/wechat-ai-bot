[project]
name = "wechat-ai-bot"
version = "0.1.0"
description = "基于 ComWeChatRobot 的 AI 智能微信机器人助手"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "WeChat AI Bot Team" }
]
keywords = ["wechat", "ai", "chatbot", "fastapi", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # ---- Web Framework ----
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.32",
    # ---- AI / LLM ----
    "openai>=1.58.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "tiktoken>=0.8.0",
    "anthropic>=0.121.0",
    # ---- Database / Cache ----
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "redis>=5.2.0",
    "alembic>=1.14.0",
    # ---- Message Queue ----
    "arq>=0.26.0",
    # ---- Data Validation ----
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    # ---- Utilities ----
    "loguru>=0.7.3",
    "tenacity>=9.0.0",
    "jieba>=0.42.1",
    # ---- RAG / Knowledge Base ----
    "chromadb>=1.5.9",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    # ---- Development ----
    "sentry-sdk>=2.67.1",
]

[project.urls]
Homepage = "https://github.com/xiehuaian77-sketch/wechat-ai-bot"
Repository = "https://github.com/xiehuaian77-sketch/wechat-ai-bot"
"Bug Tracker" = "https://github.com/xiehuaian77-sketch/wechat-ai-bot/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "config"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-pytest-hooks
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",    # line length (handled by formatter)
    "RUF001",  # fullwidth string chars (Chinese text is acceptable)
    "RUF002",  # fullwidth docstring chars
    "RUF003",  # fullwidth comment chars
]

# 测试文件的 mock 需要保持接口签名兼容，未使用参数是合理设计
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "ARG005"]

[tool.ruff.lint.isort]
known-first-party = ["app", "config", "tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "network: marks tests that require network access (deselect with '-m \"not network\"')",
]

[tool.mypy]
ignore_missing_imports = true

# 说明：核心模块（ai / agent / knowledge / api / context / message handler）
# 已全部通过严格类型检查，无需 ignore_errors 覆盖。
